<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Realms' Atlas - Interactive Map Editor</title>

    <!--Fonts-->
    <!--Style Lib-->
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon/dist/iconify-icon.min.js"></script>

    <!--Lib-->
    <script src="https://cdn.jsdelivr.net/npm/fflate/umd/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!--<script src="https://cdn.jsdelivr.net/npm/peerjs/dist/peerjs.min.js"></script>-->

    <script src="https://cdn.jsdelivr.net/npm/leaflet/dist/leaflet.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-search/dist/leaflet-search.src.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@geoman-io/leaflet-geoman-free/dist/leaflet-geoman.min.js"></script>

    <!--Style-->
    <link href="styles/initUtils.css" type="text/css" rel="stylesheet">
    <link href="styles/mapBx.css" type="text/css" rel="stylesheet">

    <!--Scripts-->
    <script src="scripts/initUtils.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <!--Banner-->
    <header>
        <h1>Realms' Atlas</h1>
        <button init-hdl id="dataShare" class="iconBtn"></button>
        <button init-hdl id="dataSave" class="iconBtn"></button>
        <button init-hdl id="dataClear" class="iconBtn"></button>
    </header>

    <!--Web Contents-->
    <main>
        <div id="fileInput">
            <h1>Insert an image or url</h1>
            <input type="file" accept="image/*" />
            <input type="text" placeholder="Or paste the url here" />
        </div>
    </main>

    <!--Popup Structure-->
</body>
</html>
